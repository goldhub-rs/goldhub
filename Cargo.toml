[workspace]
resolver = "3"
members = [
    "crates/goldhub-manifest",
    "crates/goldhub-vfs",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["ulquiorracode <ulquiorrascifferofficial@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/goldsrc-rs/goldhub"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
kdl = "4.6"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
memmap2 = "0.9"
blake3 = "1.5"
zerocopy = { version = "0.8", features = ["derive"] }
proptest = "1.6"

# Low-level ecosystem crates
wire-ring = { git = "https://github.com/ulquiorracode/wire-ring-rs.git", branch = "dev" }
stitch-data-layout = { git = "https://github.com/ulquiorracode/stitch-rs.git", branch = "dev" }
odd-int = { git = "https://github.com/ulquiorracode/odd-int-rs.git", branch = "dev" }

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
module_name_repetitions = "allow"

[profile.dev]
opt-level = 1
debug = 1
panic = "unwind"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"
